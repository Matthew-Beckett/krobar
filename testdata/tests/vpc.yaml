apiVersion: krobar.dev/v1alpha1
kind: RGDTest
metadata:
  name: vpc-renders
spec:
  rgd: ../vpc-rgd.yaml
  crds:
    - ../crds
  instance:
    apiVersion: kro.run/v1alpha1
    kind: Vpc
    metadata:
      name: myvpc
      namespace: default
    spec:
      name: myvpc
      region: eu-west-1
  observed:
    - apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: VPC
      metadata:
        name: myvpc-vpc
        namespace: myvpc
      status:
        vpcID: vpc-0123456789abcdef0
  expect:
    nodes:
      vpc:
        state: Ready
        count: 1
        objects:
          - spec:
              cidrBlocks:
                - 10.0.0.0/16
      internetGateway:
        state: Ready
        count: 1
        objects:
          - spec:
              vpc: vpc-0123456789abcdef0
