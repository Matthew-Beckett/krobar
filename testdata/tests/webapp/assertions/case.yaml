apiVersion: krobar.dev/v1alpha1
kind: TestCase
spec:
  assert:
    - name: replicas-equal-spec
      node: deployment
      cel: self.spec.replicas == instance.spec.replicas
    - name: image-is-nginx
      node: deployment
      match:
        spec:
          template:
            spec:
              containers:
                - image: {"$regex": "^nginx"}
    - name: container-exact
      node: deployment
      index: 0
      path: spec.template.spec.containers[0]
      equals:
        name: webapp-demo
        image: nginx
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 64Mi
    - name: no-annotations
      node: deployment
      absent:
        - metadata.annotations
    - name: status-present
      match:
        status: {"$any": true}
    - node: deployment
      state: Ready
      count: 1
