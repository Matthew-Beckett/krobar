apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: myapp
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      app.kubernetes.io/name: myapp
  template:
    metadata:
      labels:
        app: myapp
        app.kubernetes.io/name: myapp
    spec:
      containers:
        - image: nginx
          imagePullPolicy: Always
          name: webapp-demo
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 64Mi
      restartPolicy: Always
      serviceAccountName: default
